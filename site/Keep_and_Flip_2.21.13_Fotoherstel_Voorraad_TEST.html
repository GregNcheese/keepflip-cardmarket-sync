function delItem(id){
 const item=db.items.find(x=>x.id===id);if(!item)return;if(item.bulkOrigin||db.items.some(x=>x.bulkOrigin?.parentId===item.id)){toast('Dit onderdeel hoort bij een uitgesplitste bulk. Beheer het via Bulk uitsplitsen of herstel eerst de uitsplitsing.','error');return;}if(item.hubProvenance?.sourceType==='rip'||db.items.some(x=>x.hubParent?.itemId===id)||hubOpenIndexes(item).size){toast('Deze kaart heeft een ripsessie of geopende inhoud als herkomst. Verwijderen is geblokkeerd; herstel een back-up voor correcties.','error');return;}
 if(db.sales.some(s=>s.itemId===id)){
  toast('Deze kaart heeft gekoppelde verkopen. Verwijder die eerst via Transacties.','error');return;
 }
 const purchase=db.purchases.find(x=>x.id===item.purchaseId);
 if(!purchase){toast('Bijbehorende inkoop ontbreekt; verwijderen geannuleerd.','error');return;}
 if(purchase.allocation==='itemized'&&db.incomingOrders?.some(o=>o.receivedPurchaseId===purchase.id)){toast('Deze bestelling is gekoppeld aan Incoming. Pas de order via Incoming aan.','error');return;}
 const lotItems=db.items.filter(x=>x.purchaseId===item.purchaseId),isLast=lotItems.length===1;
 const otherSales=!isLast&&db.sales.some(s=>lotItems.some(i=>i.id===s.itemId));
 const msg=isLast?
  'Wil je "'+item.name+'" definitief verwijderen?\n\nDit is het enige product van deze inkoop. Daarom verdwijnen ook deze inkoop en de bijbehorende verzend- en douanekosten.':
  (purchase.allocation==='itemized'?'Wil je "'+item.name+'" uit deze bestelling verwijderen?\n\nDe afzonderlijke inkoopprijs van deze kaart verdwijnt ook uit het besteltotaal. De verzending blijft eenmalig betaald en wordt opnieuw over de resterende producten verdeeld.':'Wil je "'+item.name+'" uit dit lot verwijderen?\n\nDe overige kaarten blijven behouden. Het volledige oorspronkelijke inkoopbedrag, de inkomende verzending en de douanekosten blijven op het lot staan en worden opnieuw over de overblijvende kaarten verdeeld.')+
   (otherSales?'\n\nLET OP: Er zijn andere kaarten uit dit lot verkocht; hun berekende historische winst verandert door de nieuwe kostenverdeling.':'');
 if(!confirm(msg+'\n\nDeze handeling kan niet ongedaan worden gemaakt. Maak zo nodig vooraf een JSON-back-up.'))return;
 const previous=db;
 db=typeof structuredClone==='function'?structuredClone(db):JSON.parse(JSON.stringify(db));
 if(isLast){
  db.items=db.items.filter(x=>x.id!==id);
  db.purchases=db.purchases.filter(x=>x.id!==purchase.id);
 }else{
  db.items=db.items.filter(x=>x.id!==id);
  let still=db.items.filter(x=>x.purchaseId===purchase.id);
  let weights=purchase.allocation==='itemized'?(purchase.shippingAllocation==='equal'?still.map(x=>x.qty):still.map(x=>x.baseCents)):purchase.allocation==='value'?still.map(x=>(x.estimateCents||0)*x.qty):still.map(x=>x.qty);
  if(purchase.allocation==='itemized')purchase.subtotalCents=still.reduce((n,x)=>n+(x.baseCents||0),0);
  const bases=purchase.allocation==='itemized'?still.map(x=>x.baseCents):allocate(purchase.subtotalCents,weights),ships=allocate(purchase.shippingCents,weights);
  still.forEach((x,j)=>{x.baseCents=bases[j];x.shippingCents=ships[j]});
 }
 if(!save()){db=previous;return;}
 closeModal();render();
 toast(isLast?'Kaart en bijbehorende inkoop verwijderd.':purchase.allocation==='itemized'?'Product verwijderd; besteltotaal en verzending bijgewerkt.':'Kaart verwijderd. Lotkosten opnieuw verdeeld.');
}

function validateBackup(v){
 if(!v||v.version!==1||!Array.isArray(v.purchases)||!Array.isArray(v.items)||!Array.isArray(v.sales))return false;
 if(v.purchases.length>200000||v.items.length>200000||v.sales.length>500000)return false;
 let pids=new Set(v.purchases.map(x=>x.id)),imap=new Map(v.items.map(i=>[i.id,i]));if(pids.size!==v.purchases.length||imap.size!==v.items.length)return false;
 let goodExtras=v.purchases.every(p=>p.customsEntries===undefined||Array.isArray(p.customsEntries)&&p.customsEntries.length<=5000&&p.customsEntries.every(e=>typeof e.id==='string'&&typeof e.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)&&['vat','duty','handling','other'].includes(e.type)&&Number.isSafeInteger(e.amountCents)&&e.amountCents>0&&typeof e.note==='string'&&typeof e.ref==='string'));
 return goodExtras&&v.purchases.every(p=>typeof p.id==='string'&&typeof p.date==='string'&&Number.isInteger(p.subtotalCents)&&p.subtotalCents>=0&&Number.isInteger(p.shippingCents)&&p.shippingCents>=0)&&v.items.every(i=>pids.has(i.purchaseId)&&typeof i.id==='string'&&typeof i.name==='string'&&Number.isInteger(i.qty)&&i.qty>0&&Number.isInteger(i.baseCents)&&i.baseCents>=0&&Number.isInteger(i.shippingCents)&&i.shippingCents>=0)&&v.sales.every(s=>imap.has(s.itemId)&&Number.isInteger(s.qty)&&s.qty>0&&['priceCents','buyerShippingCents','shipCostCents','fixedFeeCents','packCents'].every(k=>Number.isInteger(s[k])&&s[k]>=0)&&Number.isFinite(s.feePct)&&s.feePct>=0&&s.feePct<=100)&&[...imap.values()].every(i=>v.sales.filter(s=>s.itemId===i.id).reduce((a,s)=>a+s.qty,0)<=i.qty)
}

function cmSealedExpectedCategory(parsed){
 // 52 = individual boosters, 53 = booster boxes/bundles and some larger booster products.

}

 if(!row)return false;

 if(category===51||expected!==null&&category!==expected&&!(cmInferredProductType(parsed)==='bundle'&&[52,53].includes(category)))return false;

function cmSealedMirrorExactId(parsed){

function cmIsSealedUrl(url){try{return !new URL(url).pathname.split('/').includes('Singles')}catch(_){return false}}
function cmInferredProductType(parsed){
 if(!parsed?.url||!cmIsSealedUrl(parsed.url))return '';
 const path=new URL(parsed.url).pathname.split('/').filter(Boolean),cat=String(path[3]||'').toLowerCase();
 const name=String(parsed.name||'').toLowerCase().replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim();
 // Specific formats before broad categories; never classify Booster Bundle as Booster Box.
 if(/\bultra\s*premium\s*collection\b|\bupc\b/.test(name))return 'upc';
 if(/\belite\s*trainer\s*box\b|\betb\b/.test(name))return 'etb';
 if(/\bbooster\s*bundle\b|\bbooster\s*6\s*pack\b/.test(name))return 'bundle';
 if(/\bbooster\s*box\b|\bbooster\s*display\b|\bdisplay\s*box\b/.test(name))return 'box';
 if(/\b(sleeved\s*booster|blister|booster\s*pack|booster)\b/.test(name))return 'pack';
 if(/\bcollection\s*box\b|\bcollection\b|\btin\b/.test(name))return 'other';

function cmMirrorNumber(n,code){

function kfTreeEmoji(i){return i.kind==='bulk'?'🗃️':i.kind==='sealed'?(hubIsPack(i)?'🎴':'📦'):'🃏';}

   if(hubOpenIndexes(i).has(k))return 'Geopend';
   if(hubSoldIndexes(i).has(k))return 'Verkocht';
   return hubZLabel(hubGetZone(i,k));

function kfTreeDirectChildren(i,k){
 if(!i)return [];
 const out=[];
 for(const child of db.items){
  if(child.hubParent?.itemId===i.id&&(Number.isInteger(k)?child.hubParent.unit===k:true))out.push({item:child,via:'unbox'});
  else if(child.bulkOrigin?.parentId===i.id&&(!Number.isInteger(k)||i.qty===1))out.push({item:child,via:'bulk'});

  seen.add(id);

  toast('Dit AI-voorstel is verlopen of hoort bij een ander product. Zoek opnieuw.','error');return;
 }

 for(const key of items){
  const el=fields[key],value=key==='count'?(kf2201Count(s.count)||null):key==='set'?kf2202Set(s.set):kf2202Lang(s.language);
  if(!el||!value)continue;

  if(current&&current!==String(value)&&mode==='all'){skipped.push(key);continue;}

  if(key==='set'&&current&&kf2201Norm(current)===kf2201Norm(value))continue;

 else if(skipped.length)toast('Bestaande gegevens zijn niet overschreven. Gebruik de afzonderlijke knoppen om bewust te vervangen.');

const KF_BRIDGE_OLD_SNAPSHOT = kf2207Snapshot;
kf2207Snapshot = function(root = null) {
  const result = KF_BRIDGE_OLD_SNAPSHOT(root);
  if (!result) return result;
  const ctx = kf2201Context(root);
  const el = kf2202Fields(ctx).cardsPerPack;
  const proof = el && KF_BRIDGE_ACCEPTED.get(el);
  if (proof && proof.value === String(el.value || '').trim() && proof.identity === kfBridgeIdentity(ctx)
      && proof.source && result.fields.cardsPerBooster?.status !== 'conflict') {
    result.fields.cardsPerBooster = kf2207Field(Number(proof.value), 'confirmed',
      'Onafhankelijke productbron – expliciet overgenomen');
    result.sourceRefs = [...new Set([...(result.sourceRefs||[]), proof.source])];
  }
  // Bewezen boosteraantal krijgt dezelfde herleidbare bronstatus,
  // maar nooit als de bestaande productcatalogus een conflict meldt.
  const boosterField = kf2202Fields(ctx).count;
  const boosterProof = boosterField && KF_BRIDGE_ACCEPTED.get(boosterField);
  if (boosterProof && boosterProof.value === String(boosterField.value||'').trim()
      && boosterProof.identity === kfBridgeIdentity(ctx)
      && boosterProof.source && result.fields.boostersPerPackage?.status !== 'conflict'
      && result.fields.boostersPerPackage?.status !== 'not-applicable') {
    result.fields.boostersPerPackage = kf2207Field(Number(boosterProof.value), 'confirmed',
      'Productbronnen Worker – geverifieerde productpagina');
    result.sourceRefs = [...new Set([...(result.sourceRefs||[]), boosterProof.source])];
  }
  return result;
};

/* Keep & Flip 2.21.5 TEST — Cardmarket-link → betrouwbare kaartillustratie

const KF215_PHOTO_CACHE='keepflip-v2215-verified-card-images';
const KF215_LANGS=['en','ja','ko','zh-cn','zh-tw'];
const KF215_OLD_AS_CARD=kfPhotoAsCard;
const KF215_OLD_PHOTO_FIND=cmFindPhoto;

function kf215Lang(value){
 const x=String(value||'').trim().toLowerCase().replace(/_/g,'-');
 const v={en:'en',eng:'en',english:'en',engels:'en',ja:'ja',jp:'ja',jpn:'ja',japanese:'ja',japans:'ja',ko:'ko',kr:'ko',kor:'ko',korean:'ko',koreaans:'ko',
 'zh-cn':'zh-cn','zh-hans':'zh-cn','simplified chinese':'zh-cn','vereenvoudigd chinees':'zh-cn',
 'zh-tw':'zh-tw','zh-hant':'zh-tw','traditional chinese':'zh-tw','traditioneel chinees':'zh-tw'};
 return v[x]||'';
}
function kf215KnownLanguage(parsed){return kf215Lang(parsed?.language||parsed?.cardLanguage||'');}
function kf215CanonicalName(name){
 return kfPhotoNormalName(String(name||'').replace(/\b(?:lv\.?|level)\s*\d+\b/ig,' ')
  .replace(/\b(?:holo|reverse|foil|first edition|1st edition|normal|rare)\b/ig,' ')
  .replace(/\s+v[1-9]\d?$/i,' '));
}
function kf215IsExactName(a,b){return !!(a&&b&&kf215CanonicalName(a)===kf215CanonicalName(b));}
function kf215Identity(p){return [kfPhotoIdentity(p),kf215KnownLanguage(p)||'?',cmProductId(p?.productId)||'',String(p?.url||'')].join('|');}
function kf215ReadCache(p){
 try {const v=JSON.parse(localStorage.getItem(KF215_PHOTO_CACHE)||'{}');const hit=v[kf215Identity(p)];
  return hit&&hit.at>Date.now()-30*86400000&&cmSafeImage(hit.url)?hit:null;
 }catch(_){return null;}
}
function kf215StoreCache(p,c){
 try{let all=JSON.parse(localStorage.getItem(KF215_PHOTO_CACHE)||'{}');
  if(!all||typeof all!=='object'||Array.isArray(all))all={};
  all[kf215Identity(p)]={url:c.imageUrl,source:c.source,id:c.tcgdexId||'',lang:c.language||'',at:Date.now()};
  const keys=Object.keys(all).sort((a,b)=>all[a].at-all[b].at);
  while(keys.length>250)delete all[keys.shift()];
  localStorage.setItem(KF215_PHOTO_CACHE,JSON.stringify(all));
 }catch(_){}
}

// Originele zoeker sloeg Koreaans en vereenvoudigd Chinees over, ongeacht de
// daadwerkelijk gekozen taal van de kaart. Buitenlandse plaatjes zonder
// taalmatch worden alleen als voorstel getoond, nooit stilzwijgend gekoppeld.
kfPhotoLanguages=function(parsed,parts){
 const requested=kf215KnownLanguage(parsed);
 if(requested)return [requested,...KF215_LANGS.filter(x=>x!==requested)];
 const s=String(parsed?.set||'').toLowerCase(),code=String(parts?.prefix||'').toLowerCase();
 if(/simplified chinese|vereenvoudigd chinees|zh.cn|\bchs\b/.test(s))return ['zh-cn','zh-tw','en','ja','ko'];
 if(/traditional chinese|traditioneel chinees|zh.tw|\bcht\b/.test(s))return ['zh-tw','zh-cn','en','ja','ko'];
 if(/korean|koreaans|\bkr\b/.test(s))return ['ko','en','ja','zh-cn','zh-tw'];
 if(/japan|japans|\bjp\b|terastal festival|shiny star|high class/.test(s)||/^(sm\d|sv\d|s\d+[a-z]?$)/.test(code))return ['ja','en','ko','zh-tw','zh-cn'];
 return ['en','ja','ko','zh-cn','zh-tw'];
};

// Laat bij afwijkende Cardmarket/TCGdex-benaming een exact set+nummer-record
// ten minste als kandidaat zien. Alleen naam-, set-, nummer- én taalbewijs
// maakt automatische koppeling mogelijk.
kfPhotoAsCard=function(brief,set,lang,parsed,parts,setScore){
 if(!brief?.id||!kfPhotoLocalMatches(brief.localId,parts.local)||!cmSafeImage(brief.image))return null;
 const exactName=kf215IsExactName(brief.name,parsed.name);
 const exactSet=kfPhotoNormalSet(set.name)===kfPhotoNormalSet(parsed.set);
 const known=kf215KnownLanguage(parsed);
 const sameLanguage=!known||known===lang;
 const autoLanguage=known?known===lang:lang==='en';
 const variant=String(parsed.variant||'').trim();
 const auto=exactName&&sameLanguage&&autoLanguage&&exactSet&&!variant;
 // Dit is een kandidaat voor visuele controle, geen harde Cardmarket-variantmatch.
 return {base:brief.image,source:'tcgdex',tcgdexId:String(brief.id),name:brief.name,
  set:set.name,localId:brief.localId,language:lang,confirmed:auto,
  setExact:exactSet,nameExact:exactName,languageExact:!!known&&known===lang,
  score:setScore+(exactName?65:0)+(exactSet?28:0)+(known===lang?35:0)+(lang==='en'&&!known?10:0)-(known&&known!==lang?70:0)};
};

// De bestaande secondary API is verouderd, maar blijft nuttig voor oude
// Engelstalige kaarten als TCGdex geen werkend beeld levert.
const KF215_OLD_FALLBACK=kfPhotoPokemonTcgCandidates;
async function kf215ImageCandidates(rows,max=7){
 const chosen=[],unique=new Set();
 const checks=await Promise.allSettled(rows.sort((a,b)=>b.score-a.score).slice(0,Math.max(max,10)).map(kfPhotoVerifyCandidate));
 for(const c of checks){if(c.status!=='fulfilled'||!c.value?.imageUrl||unique.has(c.value.imageUrl))continue;
  unique.add(c.value.imageUrl);chosen.push(c.value);}
 return chosen.sort((a,b)=>b.score-a.score).slice(0,max);
}
async function kf215CatalogByCardmarketId(parsed){
 const id=cmProductId(parsed.productId);
 if(!id||!parsed.name||!parsed.set||!parsed.number)return [];
 // Directe ID-vergelijking in TCGdex detail: root EN variant-niveau.
 // Geen prijs-ID uit een andere druk aan een afbeelding koppelen.
 const parts=kfPhotoNumberParts(parsed.number,parsed.set),found=[];
 const lang=kf215KnownLanguage(parsed)||'en';

function kf22113OfficialMatches(entry,p,item){

 if(!kf2219SetCompatible(p.set,entry.setName)&&kf22113Name(p.set)!==kf22113Name(entry.setCode))return false;
 const savedId=Number(item?.cm?.productId||0);
 if(savedId&&Number(entry.cardmarketCandidateId||0)&&savedId!==Number(entry.cardmarketCandidateId))return false;
 if(!p.number)return true; // Review-only: the Cardmarket link itself may omit the number (CP6 Ninetales).

function kf22113TcgPhoto(base){

 try{const u=new URL(b);if(!/^\/[A-Za-z0-9+_./%-]{5,245}$/.test(u.pathname)||u.pathname.includes('..')||u.search||u.hash)return '';

function kf22113AddCandidate(out,item,c){

function kf22113MatchTcgItem(i,p,langData){

 for(const dbi of langData){
  if(p.language&&p.language!==dbi.lang)continue;
  for(const c of dbi.cards){
   const image=kf22113TcgPhoto(c[4]);if(!image)continue;
   const setName=dbi.sets.get(c[1]);
   const byId=!!itemCardId&&itemCardId===String(c[0]).toLowerCase();
   if(!byId){
    if(!p.name||!p.set||!p.number||!kf2219NumberCompatible(p,c[1],c[2],setName))continue;

    // is a candidate, not proof of a matching localized name.
    if(/^[\x00-\x7F\s]+$/.test(c[3])&&kf22113Name(c[3])!==kf22113Name(p.name))continue;
   }
   kf22113AddCandidate(possible,i,{url:image,cardId:c[0],language:dbi.lang,localNumber:c[2],setName,
      source:'tcgdex',label:'TCGdex '+(KF2219_LANG_LABELS[dbi.lang]||dbi.lang)+' · '+setName+' · '+c[2],
      verifiedImage:false,sourcePage:'https://api.tcgdex.net/v2/'+dbi.lang+'/cards/'+encodeURIComponent(c[0])});
   if(possible.length>=5)return possible;

}
function kf22113ItemCandidates(i,langData){
 let p=kf22113ParseItem(i),out=[];
 if(!p.name||!p.set)return {parsed:p,candidates:[],reason:'Naam of set ontbreekt'};
 for(const c of KF22113.doc?.cards||[]){
  if(kf22113OfficialMatches(c,p,i))kf22113AddCandidate(out,i,{url:kf22113OfficialImage(c),cardId:c.cardId,language:c.language,
   localNumber:c.localNumber,setName:c.setName,source:'pokemon-card.com',sourcePage:c.sourcePage,
   label:'Officiële Japanse kaart · '+c.setCode+' '+c.localNumber,verifiedImage:true});
 }
 for(const c of kf22113MatchTcgItem(i,p,langData))kf22113AddCandidate(out,i,c);

async function kf22113Scan(nextPage=false){
 if(KF22113.busy)return;KF22113.busy=true;KF22113.scanId++;
 const btn=document.getElementById('kf22113Scan'),info=document.getElementById('kf22113Info');if(btn)btn.disabled=true;
 if(!nextPage)KF22113.offset=0;KF22113.rows=[];if(info)info.textContent='GitHub-bronnen en kaartindex laden…';
 try{
  try{await kf22113Load();}catch(e){KF22113.doc={cards:[]};KF22113.error=String(e?.message||e);}
  const all=kf22113StockRows();KF22113.lastTotal=all.length;
  if(KF22113.offset>=all.length)KF22113.offset=0;
  const todo=all.slice(KF22113.offset,KF22113.offset+KF22113_LIMIT);
  if(!todo.length){if(info)info.textContent='Geen kaarten zonder foto gevonden in je lokale voorraad.';document.getElementById('kf22113Results').innerHTML='';return;}
  const langs=new Set();for(const i of todo){const p=kf22113ParseItem(i);if(p.language)langs.add(p.language);else for(const l of KF2219_LANGS)langs.add(l);}
  const data=(await Promise.all([...langs].map(async l=>{try{return await kf2219LoadLang(l);}catch{return null;}}))).filter(Boolean);
  for(let k=0;k<todo.length;k++){
   const i=todo[k],r=kf22113ItemCandidates(i,data);
   KF22113.rows.push({itemId:i.id,item:{id:i.id,name:i.name},sig:kf22113IdentitySignature(i),parsed:r.parsed,candidates:r.candidates,reason:r.reason});
   if(info)info.textContent='Kaart '+(k+1)+' / '+todo.length+' onderzocht…';
   if((k+1)%10===0)await new Promise(resolve=>setTimeout(resolve,0));
  }
  kf22113RenderResults();
  const more=document.getElementById('kf22113Next');if(more){more.disabled=KF22113.offset+todo.length>=KF22113.lastTotal;more.textContent='Volgende '+KF22113_LIMIT+' kaarten ('+Math.min(KF22113.lastTotal,KF22113.offset+todo.length)+' / '+KF22113.lastTotal+')';}
  if(KF22113.error&&info)info.insertAdjacentHTML('beforeend','<p class="help">De aanvullende officiële fotobron is niet bereikbaar; TCGdex blijft als terugval beschikbaar.</p>');
 }catch(e){if(info)info.textContent='Scan kon niet worden afgerond: '+String(e?.message||e);}
 finally{KF22113.busy=false;if(btn)btn.disabled=false;}
}
function kf22113Selected(){

function kf22113UpdateApply(){const b=document.getElementById('kf22113Apply');if(b)b.disabled=KF22113.busy||!kf22113Selected().length;}
async function kf22113Apply(){
 if(KF22113.busy)return;

 KF22113.busy=true;const button=document.getElementById('kf22113Apply'),info=document.getElementById('kf22113Info');if(button)button.disabled=true;
 try{
  const seen=new Set();const next=JSON.parse(JSON.stringify(db));let count=0;
  for(const {row,candidate} of selection){
   if(seen.has(row.itemId))throw Error('Meerdere foto’s geselecteerd voor dezelfde kaart');seen.add(row.itemId);
   const current=(db.items||[]).find(i=>i.id===row.itemId),item=next.items.find(i=>i.id===row.itemId);
   if(!current||!item||!kf22113PhotoMissing(current)||kf22113IdentitySignature(current)!==row.sig)throw Error('Kaartgegevens zijn intussen gewijzigd. Scan opnieuw.');
   if(!cmSafeImage(candidate.url)||!await cmCheckImage(candidate.url))throw Error('Afbeelding niet meer bereikbaar: '+current.name);
   if(candidate.source==='pokemon-card.com'&&!KF22113.doc?.cards?.some(c=>c.cardId===candidate.cardId&&kf22113OfficialImage(c)===candidate.url))throw Error('Officiële bron is niet meer bevestigd');
   if(candidate.source==='tcgdex'&&!kf2219Image(candidate.url))throw Error('Ongeldige TCGdex-bron');
   if(item.cm?.url){item.cm.imageUrl=candidate.url;item.cm.imageSource='manual-verified-photo-'+candidate.source;}
   else{item.photoUrl=candidate.url;item.photoSource='manual-verified-photo-'+candidate.source;}

  const undo=document.getElementById('kf22113Undo');if(undo)undo.disabled=false;
  toast(count+' gecontroleerde fotovoorstellen opgeslagen.');
 }catch(e){if(info)info.textContent='Niet opgeslagen: '+String(e?.message||e);toast('Foto-update afgebroken.','error');}

<script id="kf2211-media-js">
/* Pure presentation layer: never writes to db, orders, localStorage, image URL fields or catalog records. */
(function(){
'use strict';
const cache=new Map(),MAX_CACHE=64,queue=[];
const observed=new WeakSet();
let running=0,scheduled=false;
function labelType(name='',given='',kind=''){
 const type=String(given||'').trim().toLowerCase();
 if(kind==='card'||type==='card'||type==='single')return 'card';
 if(kind==='bulk'||type==='bulk')return 'square';
 if(['upc','collection','collectionbox','collection-box'].includes(type))return 'wide';
 if(['etb','box','display','boosterbox','bundle','tin','minitin','mini-tin'].includes(type))return 'square';
 if(['pack','blister','sleeved','booster'].includes(type))return 'pack';
 const n=(String(name||'')+' '+type).toLowerCase().replace(/[_-]+/g,' ');
 if(/ultra\s*premium|\bupc\b|collection\s*box|premium\s*collection/.test(n))return 'wide';
 if(/booster\s*bundle|elite\s*trainer|\betb\b|booster\s*(box|display)|display\s*box|\bbox\b|\btin\b|\bbulk\b/.test(n))return 'square';
 if(/booster\s*pack|sleeved\s*booster|\bbooster\b|blister/.test(n))return 'pack';
 return 'auto';
}
function shapeFor(type,img){
 if(type!=='auto')return type;
 const w=img.naturalWidth||0,h=img.naturalHeight||0;
 if(!w||!h)return 'auto-portrait';
 const r=w/h;
 return r>=1.23?'wide':r>=.84?'auto-square':'auto-portrait';
}
function rowType(img){
 const row=img.closest('.lot-row');
 if(row){
  const kind=row.querySelector('[data-key="kind"]')?.value||'';
  const type=row.querySelector('[data-key="productType"]')?.value||'';
  const name=row.querySelector('[data-key="name"]')?.value||'';
  return labelType(name,type,kind);
 }
 return labelType(img.alt||'',img.dataset.kfMediaType||'');
}
function applyKind(frame,img){
 if(!frame||!img)return;
 const type=rowType(img);
 frame.dataset.kfShape=shapeFor(type,img);
 frame.dataset.kfThumbType=type;
}
function setup(img){
 if(!img || img.nodeType!==1 || observed.has(img) || img.classList.contains('kf-thumb-overlay'))return;
 const cm=img.classList.contains('cm-art'),hub=img.classList.contains('hub-art');
 const compact=img.closest('.kf2210-thumb');
 const vault=img.closest('.vault-image');
 const other=img.matches('.cm-photo-proposal img,.hub-pull-entry img,.hub-review-card img,.hub-hit-card img,.rr-hit-card img');
 if(!cm&&!hub&&!compact&&!vault&&!other)return;
 observed.add(img);
 let frame=null;
 if(cm||hub){
  const old=cm?'cm-art':'hub-art';
  frame=document.createElement('span');frame.className=old+' kf-thumb-frame';
  img.classList.remove(old);
  img.parentNode.insertBefore(frame,img);frame.appendChild(img);
 }else if(compact){frame=compact;frame.classList.add('kf-thumb-frame');}
 else if(vault){
  frame=document.createElement('span');frame.className='kf-vault-media kf-thumb-frame';
  img.parentNode.insertBefore(frame,img);frame.appendChild(img);
 }
 if(!frame){img.classList.add('kf-thumb-other');return;}
 img.classList.add('kf-thumb-source');
 applyKind(frame,img);
 // Keep original src untouched, even after optimized view renders, because other app code reads IMG.src.
 img.addEventListener('load',()=>{removeOverlay(frame,img);frame.querySelectorAll(':scope > .kf-thumb-error').forEach(n=>n.remove());img.style.display='';applyKind(frame,img);observeVisible(img);});
 const onBroken=()=>{removeOverlay(frame,img);if(!img.isConnected)return;img.style.display='none';
  if(!frame.querySelector('.kf-thumb-error')){const fallback=document.createElement('span');fallback.className='kf-thumb-error';fallback.textContent=frame.dataset.kfThumbType==='card'?'🃏':'📦';fallback.title='Afbeelding momenteel niet bereikbaar';frame.appendChild(fallback);}
 };
 img.addEventListener('error',onBroken);
 if(img.complete){if(img.naturalWidth)observeVisible(img);else onBroken();}
}
function removeOverlay(frame,img){
 frame?.querySelectorAll(':scope > img.kf-thumb-overlay').forEach(n=>n.remove());
 img?.classList.remove('kf-thumb-hidden');
}
function dist(a,b){return Math.max(Math.abs(a[0]-b[0]),Math.abs(a[1]-b[1]),Math.abs(a[2]-b[2]));}
/* Conservative trimming: transparent border, or clearly uniform opaque outer canvas with
   a strongly contrasting object boundary. Ambiguous white card edges are not cropped. */
function detectCrop(ctx,w,h){
 const d=ctx.getImageData(0,0,w,h).data;
 function pixel(x,y){const p=4*(y*w+x);return [d[p],d[p+1],d[p+2],d[p+3]];}
 const corners=[pixel(0,0),pixel(w-1,0),pixel(0,h-1),pixel(w-1,h-1)];
 const trans=corners.every(p=>p[3]<=8);
 let bg=corners[0];
 if(!trans){
  // White borders on white sources cannot be separated safely from the product.
  if(bg[0]>218&&bg[1]>218&&bg[2]>218)return null;
  if(corners.some(p=>p[3]<250||dist(p,bg)>11))return null;
  let same=0,total=0;
  for(let x=0;x<w;x+=3){total+=2;if(dist(pixel(x,0),bg)<=18)same++;if(dist(pixel(x,h-1),bg)<=18)same++;}
  for(let y=0;y<h;y+=3){total+=2;if(dist(pixel(0,y),bg)<=18)same++;if(dist(pixel(w-1,y),bg)<=18)same++;}
  if(same/total<.96)return null;
 }
 let x1=w,y1=h,x2=-1,y2=-1,count=0;
 const threshold=trans?0:40;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){
  const p=4*(y*w+x);
  const active=trans?d[p+3]>32:Math.max(Math.abs(d[p]-bg[0]),Math.abs(d[p+1]-bg[1]),Math.abs(d[p+2]-bg[2]))>threshold;
  if(!active)continue;
  count++;if(x<x1)x1=x;if(x>x2)x2=x;if(y<y1)y1=y;if(y>y2)y2=y;
 }
 if(x2<0||count/(w*h)<.10)return null;
 const margins=[x1,w-1-x2,y1,h-1-y2];
 if(Math.max(margins[0]+margins[1],margins[2]+margins[3])<.10*Math.min(w,h))return null;
 if(!trans){
  // Require a visible boundary; with a white-on-white card border the trim is unsafe.
  const insetX=Math.max(2,Math.round(w*.015)),insetY=Math.max(2,Math.round(h*.015));
  let strong=0,seen=0;
  for(let x=x1;x<=x2;x+=2){seen+=2; if(dist(pixel(x,Math.max(0,y1-insetY)),bg)>46)strong++; if(dist(pixel(x,Math.min(h-1,y2+insetY)),bg)>46)strong++;}
  for(let y=y1;y<=y2;y+=2){seen+=2; if(dist(pixel(Math.max(0,x1-insetX),y),bg)>46)strong++; if(dist(pixel(Math.min(w-1,x2+insetX),y),bg)>46)strong++;}
  // If background near candidate boundary is not uniform, preserve the original.
  if(strong/Math.max(1,seen)>.06)return null;
  // Reject mostly-white products on mostly-white margins as impossible to distinguish safely.
  if(bg[0]>225&&bg[1]>225&&bg[2]>225){
    let saturated=0,samples=0;
    for(let y=y1;y<=y2;y+=Math.max(1,Math.floor((y2-y1)/25)))for(let x=x1;x<=x2;x+=Math.max(1,Math.floor((x2-x1)/25))){const p=pixel(x,y);samples++; if(Math.max(p[0],p[1],p[2])-Math.min(p[0],p[1],p[2])>42 || Math.min(p[0],p[1],p[2])<90)saturated++;}
    if(saturated/samples<.20)return null;
  }
 }
 const pad=Math.max(2,Math.round(Math.min(w,h)*.025));
 const left=Math.max(0,x1-pad),top=Math.max(0,y1-pad),right=Math.min(w,x2+pad+1),bottom=Math.min(h,y2+pad+1);
 const gain=1-(right-left)*(bottom-top)/(w*h);
 return gain>=.13 && (right-left)>25 && (bottom-top)>25 ? {left,top,width:right-left,height:bottom-top} : null;
}
function cropUrl(url){
 return new Promise(resolve=>{
  const p=new Image();p.crossOrigin='anonymous';p.decoding='async';
  const timer=setTimeout(()=>resolve(null),3500);
  p.onload=()=>{
   clearTimeout(timer);
   try{
    const w=p.naturalWidth,h=p.naturalHeight;
    if(w<100||h<100){resolve(null);return;}
    const k=Math.min(1,360/Math.max(w,h)),sw=Math.max(1,Math.round(w*k)),sh=Math.max(1,Math.round(h*k));
    const scan=document.createElement('canvas');scan.width=sw;scan.height=sh;
    const ctx=scan.getContext('2d',{willReadFrequently:true});ctx.drawImage(p,0,0,sw,sh);
    const r=detectCrop(ctx,sw,sh);
    if(!r){resolve(null);return;}
    // Only visual, downscaled output. No base64 copy is written to inventory or JSON.
    const out=document.createElement('canvas');
    const max=480,ratio=Math.min(1,max/Math.max(r.width,r.height));
    out.width=Math.max(1,Math.round(r.width*ratio));out.height=Math.max(1,Math.round(r.height*ratio));
    out.getContext('2d').drawImage(scan,r.left,r.top,r.width,r.height,0,0,out.width,out.height);
    resolve(out.toDataURL('image/webp',.88));
   }catch(_){resolve(null);} // CORS, broken canvas, unsupported codecs -> unchanged visual
  };
  p.onerror=()=>{clearTimeout(timer);resolve(null);};
  p.src=url;
 });
}
function getCrop(src){
 if(cache.has(src))return Promise.resolve(cache.get(src));
 return new Promise(resolve=>{
  queue.push(async()=>{
   const output=await cropUrl(src);
   cache.set(src,output);
   if(cache.size>MAX_CACHE)cache.delete(cache.keys().next().value);
   resolve(output);
  });drain();
 });
}
function drain(){while(running<2&&queue.length){running++;const job=queue.shift();job().finally(()=>{running--;drain();});}}
async function tryCrop(img){
 if(!img.isConnected||!img.naturalWidth||!img.naturalHeight)return;
 const frame=img.parentElement;
 if(!frame?.classList.contains('kf-thumb-frame'))return;
 const src=img.currentSrc||img.src;
 if(!src||img.dataset.kfCropChecked===src)return;
 img.dataset.kfCropChecked=src;
 const data=await getCrop(src);
 if(!data||!img.isConnected||(img.currentSrc||img.src)!==src)return;
 removeOverlay(frame,img);
 const overlay=document.createElement('img');overlay.className='kf-thumb-overlay';overlay.alt='';overlay.setAttribute('aria-hidden','true');overlay.src=data;
 frame.appendChild(overlay);img.classList.add('kf-thumb-hidden');
}
const intersection=('IntersectionObserver'in window)?new IntersectionObserver(entries=>{
 for(const entry of entries)if(entry.isIntersecting){intersection.unobserve(entry.target);tryCrop(entry.target);}
},{rootMargin:'160px'}):null;
function observeVisible(img){
 if(img?.isConnected&&img.naturalWidth){if(intersection)intersection.observe(img);else tryCrop(img);}
}
function syncAll(){
 scheduled=false;
 document.querySelectorAll('img.cm-art,img.hub-art,.kf2210-thumb img,.vault-image img,.cm-photo-proposal img,.hub-pull-entry img,.hub-review-card img,.hub-hit-card img,.rr-hit-card img').forEach(setup);
 document.querySelectorAll('.kf-thumb-frame > img.kf-thumb-source').forEach(img=>applyKind(img.parentElement,img));
 document.querySelectorAll('.cm-art-placeholder.kf-thumb-placeholder,.hub-art.hub-placeholder.kf-thumb-placeholder').forEach(node=>applyKind(node,node));
 document.querySelectorAll('.kf2210-thumb:not(:has(img))').forEach(node=>{node.classList.add('kf-thumb-frame');applyKind(node,node);});
}
function schedule(){if(scheduled)return;scheduled=true;requestAnimationFrame(syncAll);}
function init(){
 syncAll();
 // img src changes already handled by native load; child nodes by the observer.
 const obs=new MutationObserver(mutations=>{if(mutations.some(m=>m.addedNodes.length||m.removedNodes.length))schedule();});
 obs.observe(document.body,{childList:true,subtree:true});
 document.addEventListener('change',e=>{if(e.target.closest?.('.lot-row'))schedule();},true);
 document.addEventListener('input',e=>{if(e.target.matches?.('[data-key="name"],[data-key="productType"]'))schedule();},true);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
window.kfThumb2211={labelType,shapeFor,detectCrop}; // Test-only pure helpers; no app state mutation.
})();
</script>
