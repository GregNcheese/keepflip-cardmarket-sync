name: Keep & Flip Worker — live public product search (NO SECRETS)
on:
  push:
    branches:
      - test/cloudflare-worker-gemini-autofill-218
    paths:
      - "worker/scripts/live-source-probe.mjs"
      - "worker/src/live-product-search.js"
      - ".github/workflows/worker-live-source-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-product-search:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe public catalog searches without keys, Gemini, or customer data
        run: node worker/scripts/live-source-probe.mjs
