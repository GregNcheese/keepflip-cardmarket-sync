name: Keep & Flip Worker — offline tests (NO DEPLOY)
on:
  push:
    branches:
      - test/cloudflare-worker-214-source
      - test/cloudflare-worker-autofill-216
      - test/cloudflare-worker-autofill-217
      - test/cloudflare-worker-gemini-autofill-218
    paths:
      - "worker/**"
      - ".github/workflows/cloudflare-worker-source-test.yml"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/cloudflare-worker-source-test.yml"
permissions:
  contents: read
jobs:
  offline-worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker build dependencies (GitHub only)
        run: npm --prefix worker install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm --prefix worker run check
      - name: Run offline smoke tests
        run: npm --prefix worker test
      - name: Compile Cloudflare Worker without deployment
        run: npm --prefix worker run check:cloudflare
      - name: Diagnostic live public storefront search (no keys)
        if: github.ref == 'refs/heads/test/cloudflare-worker-gemini-autofill-218'
        continue-on-error: true
        run: node worker/scripts/live-source-probe.mjs
      - name: Diagnostic real product autofill end to end (no external secrets)
        if: github.ref == 'refs/heads/test/cloudflare-worker-gemini-autofill-218'
        continue-on-error: true
        run: node worker/scripts/live-lookup-probe.mjs
# No Cloudflare API token, production deployment, or secrets involved.
