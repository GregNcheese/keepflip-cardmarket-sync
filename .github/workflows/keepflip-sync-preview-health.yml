name: Keep & Flip TEST — sync-preview health (NO SECRETS)
on:
  push:
    branches:
      - test/keepflip-sync-and-prices
    paths:
      - 'worker/**'
      - '.github/workflows/keepflip-sync-preview-health.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check real new test-preview and D1 binding as a boolean
        env:
          PREVIEW_URL: https://test-keepflip-sync-and-prices-late-smoke-2a21.chokorii.workers.dev/health
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.request
          url=os.environ['PREVIEW_URL']
          result=None
          last_error='not attempted'
          for attempt in range(4):
              try:
                  with urllib.request.urlopen(
                    urllib.request.Request(url,headers={'Accept':'application/json'}),
                    timeout=12
                  ) as r:
                      result=json.load(r)
                  if result.get('status')=='online' and result.get('version')=='2.1.8':
                      break
              except Exception as e:
                  last_error=f'{type(e).__name__}: {e}'
              time.sleep(3)
          if not result or result.get('status')!='online':
              sys.exit('New test-preview not online: '+str(last_error))
          print('TEST_PREVIEW_HEALTH '+json.dumps({
              'online':result.get('status')=='online',
              'version':result.get('version'),
              'd1Configured':bool(result.get('deviceSyncConfigured')),
              'accessConfigured':bool(result.get('accessConfigured')),
              'geminiConfigured':bool(result.get('geminiConfigured')),
              'cardosConfigured':bool(result.get('cardosConfigured'))
          }))
          assert result.get('accessConfigured'), 'Worker Bearer not configured in Preview'
          PY
