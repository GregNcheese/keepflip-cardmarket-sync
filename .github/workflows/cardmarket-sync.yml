name: Keep & Flip - Cardmarket daily data sync
on:
  push:
    branches: [main]
    paths:
      - "scripts/build_public_image_index.py"
      - "tests/test_public_image_rescue.py"
      - ".github/workflows/cardmarket-sync.yml"
  schedule:
    # 04:35 UTC, after the usual nightly Cardmarket price guide update
    - cron: '35 4 * * *'
  workflow_dispatch:
    inputs:
      refresh_catalog:
        description: 'Force fresh singles + sealed catalog from Cardmarket'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cardmarket-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache/cardmarket
          key: cm-pokemon-catalog-${{ github.run_id }}
          restore-keys: |
            cm-pokemon-catalog-
      - name: Download, validate and prepare Cardmarket datasets
        env:
          FORCE_CATALOG: ${{ inputs.refresh_catalog }}
        run: |
          if [ "$FORCE_CATALOG" = "true" ]; then
            python scripts/build_data.py --refresh-catalog
          else
            python scripts/build_data.py
          fi
      - name: Verify photo-index safety (free; no private data)
        run: python -m unittest discover -s tests -p 'test_public_image_rescue.py' -v
      - name: Build / reuse public shop image URLs (free; no keys)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, shutil, pathlib, datetime as dt
          from urllib.request import Request,urlopen
          from scripts.build_public_image_index import build,SCHEMA
          target=pathlib.Path('site/data/image-rescue.json')
          target.parent.mkdir(parents=True,exist_ok=True)
          previous=pathlib.Path('.cache/cardmarket/image-rescue.json')
          previous.parent.mkdir(parents=True,exist_ok=True)
          url='https://gregncheese.github.io/keepflip-cardmarket-sync/data/image-rescue.json'
          try:
              with urlopen(Request(url,headers={'User-Agent':'KeepFlip-ImageIndex/1.0'}),timeout=16) as res:
                  raw=res.read(7_000_001)
              if len(raw)>7_000_000:raise ValueError('Index too big')
              doc=json.loads(raw)
              if doc.get('schema')==SCHEMA and len(doc.get('images',[]))>0:
                  previous.write_bytes(raw)
          except Exception as e:
              print('Previous public image index unavailable:',type(e).__name__)
          reuse=False
          if previous.exists():
              try:
                  data=json.loads(previous.read_text())
                  stamp=dt.datetime.fromisoformat(data['generatedAt'])
                  if stamp.tzinfo is None:stamp=stamp.replace(tzinfo=dt.timezone.utc)
                  age=dt.datetime.now(dt.timezone.utc)-stamp
                  reuse=(dt.timedelta(0)<=age<dt.timedelta(days=6)
                          and not data.get('upstreamFailures')
                          and data.get('schema')==SCHEMA)
              except (ValueError,KeyError,TypeError):pass
          if reuse:
              shutil.copyfile(previous,target)
              print('PHOTO_INDEX_REUSED: recent public URLs; no retailer crawling')
          else:
              build(target,existing=previous if previous.exists() else None)
          print('PHOTO_INDEX_COUNT:',len(json.loads(target.read_text())['images']))
          PY
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static data files
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
