name: Keep & Flip - Cardmarket identity TEST
on:
  pull_request:
    paths:
      - "scripts/build_card_identity.py"
      - "scripts/build_and_index.py"
      - "config/cardmarket_targets.json"
      - "tests/**"
      - ".github/workflows/cardmarket-identity-test.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Build preview with current official Cardmarket data
        run: python scripts/build_and_index.py --refresh-catalog
      - name: Check preview output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("site/data/card-identity.json")
          if not p.exists(): raise SystemExit("Identity JSON missing; see resolver errors above")
          doc=json.loads(p.read_text(encoding="utf-8"))
          assert doc.get("schema") == "keepflip-cardmarket-identity-v1"
          assert len(doc.get("results",[])) == 5
          print("PREVIEW IDENTITY STATUSES:")
          for row in doc["results"]:
            print(row["label"], row["status"], row.get("productId"), row.get("reason"))
          PY
      - name: Upload preview JSON only (no GitHub Pages deployment)
        uses: actions/upload-artifact@v4
        with:
          name: keepflip-identity-preview
          path: |
            site/data/card-identity.json
            site/data/manifest.json
          if-no-files-found: error
