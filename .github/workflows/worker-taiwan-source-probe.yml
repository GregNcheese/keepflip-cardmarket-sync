name: Keep & Flip TEST — Taiwan public product source probe
on:
  push:
    branches:
      - test/cloudflare-worker-gemini-autofill-218
    paths:
      - "worker/scripts/taiwan-source-probe.mjs"
      - ".github/workflows/worker-taiwan-source-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Check public product searches without tokens or paid search
        run: node worker/scripts/taiwan-source-probe.mjs
