name: Keep & Flip TEST — image rescue catalogue (NO API KEYS)
on:
  push:
    branches: [test/github-image-rescue-22119]
    paths:
      - "scripts/build_public_image_index.py"
      - "tests/test_public_image_rescue.py"
      - ".github/workflows/image-rescue-22119.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: keepflip-image-rescue-22119
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline validation — no API usage
        run: python -m unittest discover -s tests -p 'test_public_image_rescue.py' -v
      - name: Query publicly accessible Pokémon store catalogues (metadata only)
        run: |
          python scripts/build_public_image_index.py --out test-data/image-rescue-22119/index.json --existing test-data/image-rescue-22119/index.json
      - name: Commit public photo URLs and source pages (no photo files)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-data/image-rescue-22119/index.json
          if ! git diff --cached --quiet; then
            git commit -m "test(images): refresh verified public product photo URL index [skip ci]"
            git push origin HEAD:test/github-image-rescue-22119
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: keepflip-image-rescue-metadata-only
          path: test-data/image-rescue-22119/index.json
          retention-days: 14
