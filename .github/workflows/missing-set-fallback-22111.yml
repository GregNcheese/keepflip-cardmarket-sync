name: Keep & Flip - Missing Cardmarket Sets 2.21.11 TEST
on:
  push:
    branches:
      - test/missing-set-fallback-22111
    paths:
      - scripts/build_cardmarket_set_fallbacks.py
      - config/cardmarket_set_anchors.json
      - tests/test_cardmarket_set_fallbacks.py
      - .github/workflows/missing-set-fallback-22111.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test official-only matching offline
        run: python -m unittest discover -s tests -p 'test_cardmarket_set_fallbacks.py' -v
      - name: Build verified missing-set lookup from official Cardmarket export
        run: python scripts/build_cardmarket_set_fallbacks.py
      - name: Validate official Ninetales anchor and no unverified prices
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('test-data/universal-2219/cardmarket-set-fallbacks.json')
          d=json.loads(p.read_text())
          assert d['schema']=='keepflip-cardmarket-set-fallback-v1'
          groups=d['sets']; assert len(groups)==1
          cp6=groups[0]
          assert cp6['verifiedAnchorProductId']==562471
          assert 10<=len(cp6['products'])<=500
          matches=[x for x in cp6['products'] if x[0]==562471]
          assert len(matches)==1 and 'ninetales' in matches[0][1].lower()
          print('PASS official anchor:',matches[0])
          PY
      - name: Commit verified snapshot to TEST branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-data/universal-2219/cardmarket-set-fallbacks.json
          if ! git diff --cached --quiet; then
            git commit -m 'test data: verified Cardmarket set fallback [skip ci]'
            git push origin HEAD:test/missing-set-fallback-22111
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: keepflip-cardmarket-set-fallback-22111
          path: test-data/universal-2219/cardmarket-set-fallbacks.json
          if-no-files-found: error
# Never deploy GitHub Pages or modify main; no personal Keep & Flip data.
