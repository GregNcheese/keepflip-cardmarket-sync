name: Keep & Flip TEST — Taiwan regional sealed coverage (NO SECRETS)
on:
  push:
    branches:
      - test/cloudflare-worker-gemini-autofill-218
    paths:
      - "worker/scripts/taiwan-coverage-audit.mjs"
      - ".github/workflows/worker-taiwan-coverage-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Test real Taiwan storefront product lookup, without tokens or billing
        run: node worker/scripts/taiwan-coverage-audit.mjs
      - name: Preserve temporary audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keepflip-taiwan-regional-audit
          path: worker/audit-results/taiwan-coverage.json
          if-no-files-found: warn
          retention-days: 7
