name: Keep & Flip TEST — public Korean product source probe
on:
  push:
    branches:
      - test/cloudflare-worker-gemini-autofill-218
    paths:
      - "worker/scripts/korean-source-probe.mjs"
      - ".github/workflows/worker-korean-source-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  korean-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe public search endpoints without keys
        run: node worker/scripts/korean-source-probe.mjs
